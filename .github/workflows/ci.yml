name: CI

on:
  push:
    # Current work uses codex/* branches and pull_request CI (AGENTS.md §6.5).
    # Keep develop pushes covered for legacy compatibility; PR #4 is not a merge target.
    branches: [master, main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest + pyflakes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock

      - name: Install dependencies (lock 优先，缺失回退 requirements.txt)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi

      - name: pytest（全量单测，设计为离线运行）
        # 固定四个 worker，按文件分配以保留模块级夹具/共享 TestClient；仍收集全量用例。
        # pyproject 已含 -q；重复添加会隐藏汇总。保留慢项记录供分钟治理。
        run: python -m pytest -n 4 --dist loadfile --basetemp=/tmp/pytest-ci --durations=20 --junitxml=/tmp/backend-junit.xml

      - name: pyflakes（静态检查）
        run: python -m pyflakes app tests scripts

  frontend:
    name: frontend (tsc + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: 单元测试（vitest 全量，纯函数与组件）
        # 纯函数文件按需声明 Node 环境；组件/浏览器行为仍走 jsdom，保留默认隔离。
        run: npx vitest run

      - name: ESLint
        run: npx eslint .

      # 构建期才暴露的问题（Next 约定的文件结构、server/client 组件边界、
      # 构建期导入）仍需真实构建验证；tsc 与单元测试不能替代构建。
      # 2026-09-11 本地实测（**移走 .env.local 模拟 CI**，因为它被 gitignore、
      # CI 上必然不存在）：构建成功，约 31s，8/8 静态页 ⇒ 无需额外环境变量。
      - name: 生产构建（next build）
        run: npx next build

  docs:
    name: docs (doc-health)
    runs-on: ubuntu-latest
    # 只依赖标准库（re/sys/pathlib），无需安装任何依赖即可跑。
    # 退出码语义：0 = 全部通过，1 = 有待处理项（脚本内 `return 0 if problems == 0 else 1`）。
    # 2026-09-11 进 CI 的当天就抓到一例：新增 KB 条目把 docs/kb/03-engineering.md
    # 推到 807 行 > 800 配额，而本地收尾漏跑体检 ⇒ 若非进 CI，这条会一直挂在仓库里。
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Public repo 密钥 / 隐私扫描
        run: python3 scripts/audit/public_repo_scan.py

      - name: 工作区卫生（禁止应用专属目录 / 隐藏规则）
        run: python3 scripts/workspace-hygiene.py

      - name: 文档体检（未登记 / 死链 / 超层配额 / 摘要缺失）
        run: python3 scripts/doc-health.py
