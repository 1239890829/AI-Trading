# 开发用 compose；生产部署见 docs/deployment.md
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ASHARE_DATA_PROVIDER: ${ASHARE_DATA_PROVIDER:-eastmoney}
      ASHARE_POLL_INTERVAL_SECONDS: ${ASHARE_POLL_INTERVAL_SECONDS:-5}
      ASHARE_WATCHLIST: ${ASHARE_WATCHLIST:-600519,000001,300750,601318}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm install --no-fund --no-audit && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    volumes:
      - ./apps/web:/web
    depends_on:
      - backend
    restart: unless-stopped
